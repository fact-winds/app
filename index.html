<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Salkku</title>
<style>
:root{--bg:#0a0a0c;--card:#151518;--card2:#1f1f24;--tx:#f2f2f4;--mut:#8e8e96;--grn:#00c878;--red:#ff3b7f;--teal:#26d0c9;--yel:#f2c94c;--brd:#26262b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:50}
#lock h1{font-size:20px;font-weight:600}
#pw{background:var(--card);border:1px solid var(--brd);color:var(--tx);padding:12px 16px;border-radius:12px;font-size:17px;width:100%;max-width:320px;text-align:center}
#unlockBtn{background:var(--teal);color:#000;border:0;padding:12px 28px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
#lockMsg{color:var(--red);font-size:13px;min-height:18px}
main{max-width:760px;margin:0 auto;padding:8px 12px 60px;display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 4px;position:sticky;top:0;background:var(--bg);z-index:10}
.topbar .st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.spin{width:13px;height:13px;border:2px solid var(--brd);border-top-color:var(--teal);border-radius:50%;animation:sp .9s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);flex-shrink:0}
.dot.warn{background:#e3a008}
#refreshBtn{background:var(--card);border:1px solid var(--brd);color:var(--tx);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.pos{color:var(--grn)}.neg{color:var(--red)}
.heroCard{background:var(--card);border-radius:20px;margin-top:8px;padding:18px 16px 14px;overflow:hidden}
.nvrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nvrow .lbl{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:7px}
.nvrow .big{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.nvrow .ret{text-align:right;cursor:pointer;user-select:none}
.nvrow .ret .big{font-size:21px;font-weight:700}
#eye{cursor:pointer;opacity:.8}
.divline{border-left:1px solid var(--brd)}
#chartWrap{position:relative;margin:12px -4px 4px}
#chart{width:100%;height:260px;display:block;touch-action:pan-y}
#tip{position:absolute;top:2px;left:4px;font-size:12px;color:var(--mut);pointer-events:none}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.lpill{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:18px;padding:7px 12px;font-size:13px;cursor:pointer}
.lpill .sw{width:8px;height:8px;border-radius:50%}
.pillbtn{margin-left:auto;background:var(--card2);border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer;user-select:none}
.pillbtn.sec{margin-left:0}
.optRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.optRow.hidden{display:none}
.chip{background:var(--card2);border:1px solid transparent;border-radius:16px;padding:6px 12px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
.chip.on{color:var(--tx);border-color:var(--teal)}
.chip.act{color:var(--teal)}
.hlrow{display:flex;gap:8px;margin-top:10px}
.hl{flex:1;background:var(--card);border-radius:16px;padding:11px 8px;text-align:center}
.hl .l{font-size:11px;color:var(--mut)}
.hl .v{font-size:15px;font-weight:600;margin-top:3px}
.hl .s{font-size:11px;color:var(--mut);margin-top:2px}
.card{background:var(--card);border-radius:16px;margin-top:12px;overflow:hidden}
.card h2{font-size:13px;letter-spacing:.4px;color:var(--mut);padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .v{font-size:13px;color:var(--tx);font-weight:600}
.hcard{background:var(--card);border-radius:16px;margin-top:8px;padding:13px 14px;cursor:pointer}
.hcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hcard .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .px{font-size:13px;color:var(--mut);flex-shrink:0}
.grid4{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;margin-top:9px}
.g .l{font-size:11px;color:var(--mut)}
.g .v{font-size:13px;font-weight:600;margin-top:2px}
.badge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--card2);color:var(--mut)}
.badge.stale{color:#e3a008}
.lots{margin-top:10px;border-top:1px solid var(--brd);padding-top:8px}
#allocWrap{display:flex;gap:10px;padding:14px;flex-wrap:wrap;justify-content:center}
canvas.donut{max-width:280px;max-height:280px}
.legend{display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:13px;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-top:1px solid var(--brd);gap:10px}
.row:first-of-type{border-top:0}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:12px;line-height:1.6}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{flex:1;text-align:center;padding:9px;border-radius:18px;background:var(--card);color:var(--mut);font-size:13px;cursor:pointer}
.tab.on{color:#000;background:var(--teal);font-weight:600}
@media (max-width:400px){.nvrow .big{font-size:23px}.nvrow .ret .big{font-size:18px}}
</style>
</head>
<body>
<div id="lock">
  <h1>Salkku</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="unlockBtn">Unlock</button>
  <div id="lockMsg"></div>
</div>
<main id="app">
  <div class="topbar">
    <div class="st" id="statusBox"><span class="spin"></span><span id="statusTx">Loading…</span></div>
    <button id="refreshBtn">↻</button>
  </div>
  <div class="heroCard">
    <div class="nvrow">
      <div style="flex:1">
        <div class="lbl"><span id="nvLbl">Net asset value</span> <span id="eye">👁</span></div>
        <div class="big" id="totVal">–</div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px" id="totSub"></div>
      </div>
      <div class="ret divline" style="padding-left:14px" id="retBox">
        <div class="lbl" style="justify-content:flex-end">Return <span id="retPer"></span> ⇅</div>
        <div class="big" id="retVal">–</div>
      </div>
    </div>
    <div id="chartWrap"><canvas id="chart"></canvas><div id="tip"></div></div>
    <div class="cbar">
      <div id="legendPills" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <div class="lpill" id="cmpBtn">＋ Compare</div>
      <div class="pillbtn sec" id="filtBtn">Filter</div>
      <div class="pillbtn" id="perBtn">–</div>
    </div>
    <div class="optRow hidden" id="perRow">
      <div class="chip crng" data-r="1">1 pv</div>
      <div class="chip crng" data-r="7">7 pv</div>
      <div class="chip crng" data-r="30">30 pv</div>
      <div class="chip crng" data-r="ytd">YTD</div>
      <div class="chip crng" data-r="365">1 v</div>
      <div class="chip crng" data-r="9999">Max</div>
    </div>
    <div class="optRow hidden" id="cmpRow"></div>
    <div class="optRow hidden" id="acctFilt"></div>
    <div class="optRow hidden" id="clsFilt"></div>
  </div>
  <div class="hlrow" id="hl"></div>
  <div id="bmkCard"></div>
  <div class="tabs">
    <div class="tab on" data-t="port">Portfolio</div>
    <div class="tab" data-t="alloc">Allocation</div>
  </div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</main>

  {f:u=>"https://corsproxy.io/?url="+encodeURIComponent(u),fails:0},
  {f:u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),fails:0},
  {f:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),fails:0}
];
let NETDEAD=false;
async function pfetch(url){
  if(NETDEAD)return null;
  for(const p of PROXIES){
    if(p.fails>=4)continue;
    try{
      const r=await fetch(p.f(url),{signal:AbortSignal.timeout(7000)});
      if(r.ok){
        const t=await r.text();
        if(t&&t.length>40){ p.fails=0; return JSON.parse(t); }
      }
      p.fails++;
    }catch(e){ p.fails++; }
  }
  if(PROXIES.every(p=>p.fails>=4))NETDEAD=true;
  return null;
}
async function getFx(){
  const end=new Date().toISOString().slice(0,10);
  try{
    const r=await fetch(`https://api.frankfurter.dev/v1/2025-03-01..${end}?base=EUR&symbols=USD,SEK`,{signal:AbortSignal.timeout(12000)});
    if(r.ok){const j=await r.json();FXH=j.rates;const ks=Object.keys(j.rates).sort();const last=j.rates[ks[ks.length-1]];FXNOW={USD:last.USD,SEK:last.SEK};}
  }catch(e){}
}
function fxOn(date,ccy){
  if(ccy==="EUR")return 1;
  if(!FXH)return 1/FXNOW[ccy];
  let d=date;
  for(let i=0;i<10;i++){ if(FXH[d])return 1/FXH[d][ccy]; d=dayBefore(d); }
  return 1/FXNOW[ccy];
}
function symCache(){try{return JSON.parse(localStorage.getItem("symc")||"{}")}catch(e){return{}}}
async function resolveSym(inst){
  if(inst.sym||!inst.search)return;
  const c=symCache(), key=inst.search[0];
  if(c[key]&&Date.now()-c[key].t<6048e5){inst.sym=c[key].s||null;return;}
  for(const q of inst.search){
    if(/^[A-Z0-9.\-]{2,14}$/.test(q)&&q.includes(".")){
      const j=await pfetch(`https://query1.finance.yahoo.com/v8/finance/chart/${q}?range=5d&interval=1d`);
      if(j&&j.chart&&j.chart.result){inst.sym=q;break;}
    }else{
      const j=await pfetch(`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=6&newsCount=0`);
      let qs=(j&&j.quotes)||[];
      if(inst.match)qs=qs.filter(x=>((x.shortname||"")+" "+(x.longname||"")).toLowerCase().includes(inst.match.toLowerCase()));
      const pick=qs.find(x=>x.quoteType==="MUTUALFUND"&&/\.(F|ST|HE|IR|L)$/.test(x.symbol))||qs.find(x=>x.quoteType==="MUTUALFUND")||qs.find(x=>/\.(HE|ST|F)$/.test(x.symbol))||(inst.match?qs[0]:null);
      if(pick){inst.sym=pick.symbol;break;}
    }
  }
  c[key]={s:inst.sym||null,t:Date.now()};
  try{localStorage.setItem("symc",JSON.stringify(c))}catch(e){}
}
async function getQuote(sym){
  const j=await pfetch(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=2y&interval=1d`);
  try{
    const res=j.chart.result[0], m=res.meta, raw=res.indicators.quote[0].close, ts=res.timestamp;
    const series={};
    for(let i=0;i<ts.length;i++){ if(raw[i]!=null)series[dstr(ts[i])]=raw[i]; }
    const dates=Object.keys(series).sort();
    const last=m.regularMarketPrice??series[dates[dates.length-1]];
    if(m.regularMarketPrice!=null)series[dates[dates.length-1]]=m.regularMarketPrice;
    const prev=dates.length>1?series[dates[dates.length-2]]:m.chartPreviousClose;
    return {last,prev,series,dates,ccy:m.currency,time:m.regularMarketTime||null};
  }catch(e){return null;}
}
function priceEur(id,d){
  const inst=D.instruments[id];
  const q=inst.sym&&Q[inst.sym];
  if(q&&q.series){
    let dd=d, c=null;
    for(let i=0;i<12;i++){ if(q.series[dd]!=null){c=q.series[dd];break;} dd=dayBefore(dd); }
    if(c==null)c=q.series[q.dates[0]];
    const cc=q.ccy||inst.ccy;
    return c*(cc==="EUR"?1:fxOn(d,cc));
  }
  if(inst.nav){
    const nav=inst.nav;
    if(d<=nav[0][0])return nav[0][1];
    for(let i=0;i<nav.length-1;i++){
      if(d>=nav[i][0]&&d<=nav[i+1][0]){
        const t0=new Date(nav[i][0]).getTime(), t1=new Date(nav[i+1][0]).getTime(), t=new Date(d).getTime();
        return nav[i][1]+(nav[i+1][1]-nav[i][1])*(t1>t0?(t-t0)/(t1-t0):0);
      }
    }
    return nav[nav.length-1][1];
  }
  if(inst.fb!=null){
    if(inst.fbEur||inst.ccy==="EUR")return inst.fb;
    return inst.fb/FXNOW[inst.ccy];
  }
  return 0;
}
function livePriceEur(id){ return priceEur(id,new Date().toISOString().slice(0,10)); }
function validateSyms(){
  for(const id in D.instruments){
    const inst=D.instruments[id];
    if(inst.noval)continue;
    if(!inst.sym||!inst.nav||!Q[inst.sym]||!Q[inst.sym].series)continue;
    const [ld,lv]=inst.nav[inst.nav.length-1];
    const q=Q[inst.sym];
    let dd=ld,c=null;
    for(let i=0;i<12;i++){ if(q.series[dd]!=null){c=q.series[dd];break;} dd=dayBefore(dd); }
    if(c==null)continue;
    const cc=q.ccy||inst.ccy;
    const pe=c*(cc==="EUR"?1:fxOn(ld,cc));
    const ratio=pe/lv;
    if(!(ratio>0.8&&ratio<1.25)){ inst.sym=null; }
  }
}
function dayChangeEur(id,qy){
  const inst=D.instruments[id], q=inst.sym&&Q[inst.sym];
  if(!q||!q.series||q.last==null)return null;
  const todayFi=fiDayOf(Date.now());
  const lastTrade=q.time?fiDayOf(q.time*1000):q.dates[q.dates.length-1];
  if(lastTrade!==todayFi)return 0;
  let refD=null;
  for(let i=q.dates.length-1;i>=0;i--){ if(q.dates[i]<todayFi){refD=q.dates[i];break;} }
  if(refD==null)return 0;
  const cc=q.ccy||inst.ccy;
  const lastEur=q.last*(cc==="EUR"?1:1/FXNOW[cc]);
  const refEur=q.series[refD]*(cc==="EUR"?1:fxOn(refD,cc));
  return (lastEur-refEur)*qy;
}
// ---- ledger ----
function buildLedger(){
  const evs=[...D.events].sort((a,b)=>a[0]<b[0]?-1:1);
  const start=evs[0][0];
  const ds=new Set(); evs.forEach(e=>ds.add(e[0]));
  for(const i of Object.values(D.instruments)){
    const q=i.sym&&Q[i.sym];
    if(q&&q.dates)for(const d of q.dates)if(d>=start)ds.add(d);
  }
  const today=new Date().toISOString().slice(0,10); ds.add(today);
  let dates=[...ds].sort();
  if(dates[0]<start)dates=dates.filter(d=>d>=start);
  const accts={}; D.accounts.forEach(a=>accts[a.id]={qty:{},cost:{},cash:0});
  const series={}; D.accounts.forEach(a=>series[a.id]=[]); series._flows={};
  const clsHist=[];
  const dailyAdj={};
  {
    const firstEv={};
    for(const e of evs)if(!firstEv[e[1]])firstEv[e[1]]=e[0];
    const sim={}; D.accounts.forEach(a=>sim[a.id]={cash:0,qty:{},lastCk:firstEv[a.id]||dates[0]});
    for(const [ed,aid,k,...r] of evs){
      const S=sim[aid]; if(!S)continue;
      if(k==="flow")S.cash+=r[0];
      else if(k==="buy"||k==="sell"){
        let amt=r[2];
        if(amt==null)amt=(r[1]||0)*priceEur(r[0],ed);
        const qy=r[1]!=null?r[1]:(amt/(priceEur(r[0],ed)||1));
        S.qty[r[0]]=(S.qty[r[0]]||0)+(k==="buy"?1:-1)*qy;
        S.cash-=(k==="buy"?1:-1)*amt;
      }
      else if(k==="set"){
        const delta=r[1]-(S.qty[r[0]]||0);
        S.cash-=delta*priceEur(r[0],ed);
        S.qty[r[0]]=r[1];
      }
      else if(k==="cash"){
        const drift=r[0]-S.cash;
        const span=dates.filter(x=>x>S.lastCk&&x<=ed);
        if(span.length&&Math.abs(drift)>0.01){
          const per=drift/span.length;
          const isFlow=Math.abs(drift)>25000;
          dailyAdj[aid]=dailyAdj[aid]||{};
          for(const x of span){
            const cur=dailyAdj[aid][x]||{amt:0,flow:0};
            cur.amt+=per; if(isFlow)cur.flow+=per;
            dailyAdj[aid][x]=cur;
          }
        }
        S.cash=r[0]; S.lastCk=ed;
      }
    }
  }
  const valHist=[], flowHist={};
  const addFlow=(ed,aid,cl,amt)=>{ if(!amt)return; const fh=flowHist[ed]=flowHist[ed]||{}; const k=aid+"|"+cl; fh[k]=(fh[k]||0)+amt; };
  let ei=0;
  for(const d of dates){
    for(const a of D.accounts){
      const ad=dailyAdj[a.id];
      if(ad&&ad[d]){
        accts[a.id].cash+=ad[d].amt;
        if(ad[d].flow){
          series._flows[d+a.id]=(series._flows[d+a.id]||0)+ad[d].flow;
          addFlow(d,a.id,"Cash",ad[d].flow);
        }
      }
    }
    while(ei<evs.length&&evs[ei][0]<=d){
      const [ed,aid,k,...r]=evs[ei]; ei++;
      const A=accts[aid]; if(!A)continue;
      if(k==="flow"){ A.cash+=r[0]; series._flows[ed+aid]=(series._flows[ed+aid]||0)+r[0]; addFlow(ed,aid,"Cash",r[0]); }
      else if(k==="cash"){ A.cash=r[0]; }
      else if(k==="buy"||k==="sell"){
        let [inst,qty,amt]=r;
        const p=priceEur(inst,ed);
        if(qty==null)qty=amt!=null&&p?amt/p:0;
        if(amt==null)amt=qty*p;
        const s=k==="buy"?1:-1;
        if(k==="buy"){A.cost[inst]=(A.cost[inst]||0)+amt;}
        else{const held=A.qty[inst]||0;const avg=held?(A.cost[inst]||0)/held:0;A.cost[inst]=(A.cost[inst]||0)-avg*qty;}
        A.qty[inst]=(A.qty[inst]||0)+s*qty;
        if(Math.abs(A.qty[inst])<1e-6){A.qty[inst]=0;A.cost[inst]=0;}
        A.cash-=s*amt;
        addFlow(ed,aid,D.instruments[inst].cls,s*amt);
        addFlow(ed,aid,"Cash",-s*amt);
      }
      else if(k==="set"){
        const [inst,qty]=r;
        const cur=A.qty[inst]||0, delta=qty-cur;
        if(Math.abs(delta)>1e-9){
          const p=priceEur(inst,ed), amt=Math.abs(delta)*p;
          if(delta>0)A.cost[inst]=(A.cost[inst]||0)+amt;
          else{const avg=cur?(A.cost[inst]||0)/cur:0;A.cost[inst]=(A.cost[inst]||0)-avg*Math.abs(delta);}
          A.cash-=delta*p;
          addFlow(ed,aid,D.instruments[inst].cls,delta*p);
          addFlow(ed,aid,"Cash",-delta*p);
        }
        A.qty[inst]=qty;
        if(Math.abs(A.qty[inst])<1e-6){A.qty[inst]=0;A.cost[inst]=0;}
      }
    }
    let byCls={}, cells={};
    for(const a of D.accounts){
      const A=accts[a.id];
      let v=A.cash;
      byCls["Cash"]=(byCls["Cash"]||0)+A.cash;
      cells[a.id+"|Cash"]=(cells[a.id+"|Cash"]||0)+A.cash;
      for(const id in A.qty){
        if(!A.qty[id])continue;
        const inst=D.instruments[id];
        const pv=inst.atCost?(A.cost[id]||0):A.qty[id]*priceEur(id,d);
        v+=pv;
        byCls[inst.cls]=(byCls[inst.cls]||0)+pv;
        cells[a.id+"|"+inst.cls]=(cells[a.id+"|"+inst.cls]||0)+pv;
      }
      series[a.id].push(v);
    }
    clsHist.push(byCls);
    valHist.push(cells);
  }
  const twrIds=D.accounts.filter(a=>a.twr).map(a=>a.id);
  const agg=dates.map((d,i)=>twrIds.reduce((s,id)=>s+series[id][i],0));
  const twr=[]; let idx=null;
  for(let i=0;i<dates.length;i++){
    const F=twrIds.reduce((s,id)=>s+(series._flows[dates[i]+id]||0),0);
    if(idx==null){ if(agg[i]>50000)idx=100; twr.push(idx); continue; }
    const v0=agg[i-1];
    if(v0>50000){ const r=(agg[i]-F-v0)/v0; if(Math.abs(r)<0.5)idx*=(1+r); }
    twr.push(idx);
  }
  const total=dates.map((d,i)=>D.accounts.reduce((s,a)=>s+series[a.id][i],0));
  return {dates,series,total,twr,agg,accts,start,clsHist,valHist,flowHist};
}
function allClasses(){ const s=new Set(["Cash"]); for(const id in D.instruments)s.add(D.instruments[id].cls); return [...s]; }
function filtersActive(){ return SELA&&SELC&&(SELA.size<D.accounts.length||SELC.size<allClasses().length); }
function filterSeries(){
  if(!LED)return null;
  if(!SELA||!SELC)return {tot:LED.total,twr:LED.twr,flows:new Array(LED.dates.length).fill(0)};
  const twrOk=new Set(D.accounts.filter(a=>a.twr).map(a=>a.id));
  const n=LED.dates.length;
  const tot=new Array(n), tw=new Array(n), fAll=new Array(n).fill(0);
  const noTwr=![...SELC].some(c=>c!=="Cash");
  let idx=null, prevV=null;
  for(let i=0;i<n;i++){
    let v=0, vt=0;
    const cells=LED.valHist[i];
    for(const k in cells){
      const pi=k.indexOf("|"), a=k.slice(0,pi), c=k.slice(pi+1);
      if(SELA.has(a)&&SELC.has(c)){ v+=cells[k]; if(twrOk.has(a))vt+=cells[k]; }
    }
    tot[i]=v;
    let F=0;
    const fl=LED.flowHist[LED.dates[i]];
    if(fl)for(const k in fl){
      const pi=k.indexOf("|"), a=k.slice(0,pi), c=k.slice(pi+1);
      if(SELA.has(a)&&SELC.has(c)){ fAll[i]+=fl[k]; if(twrOk.has(a))F+=fl[k]; }
    }
    if(noTwr){ tw[i]=null; prevV=vt; continue; }
    if(idx==null){ if(vt>50000)idx=100; tw[i]=idx; prevV=vt; continue; }
    if(prevV>50000){ const r=(vt-F-prevV)/prevV; if(Math.abs(r)<0.5)idx*=(1+r); }
    tw[i]=idx; prevV=vt;
  }
  return {tot,twr:tw,flows:fAll};
}
function paOf(dates,twr){
  let i0=-1,i1=-1;
  for(let i=0;i<twr.length;i++){ if(twr[i]!=null){ if(i0<0)i0=i; i1=i; } }
  if(i0<0||i1<=i0)return null;
  const yrs=(new Date(dates[i1])-new Date(dates[i0]))/(365.25*864e5);
  if(yrs<=0.05)return null;
  return (Math.pow(twr[i1]/twr[i0],1/yrs)-1)*100;
}
function bmkLine(dates,mix){
  let idx=100, prev=null; const out=[];
  const closeOn=(sym,d)=>{const q=Q[sym];if(!q)return null;let dd=d;for(let i=0;i<12;i++){if(q.series[dd]!=null)return q.series[dd];dd=dayBefore(dd);}return null;};
  for(const d of dates){
    const ps=mix.map(([s])=>closeOn(s,d));
    if(ps.some(p=>p==null)){out.push(null);continue;}
    if(prev){let r=0;mix.forEach(([s,w],i)=>{r+=w*(ps[i]/prev[i]-1);});idx*=1+r;}
    prev=ps; out.push(idx);
  }
  return out;
}
function bmkRangePct(def){
  if(RANGE===1){
    let r=0;
    for(const [s,w] of def.mix){const q=Q[s];if(!q||q.prev==null||q.last==null)return null;r+=w*(q.last/q.prev-1);}
    return r*100;
  }
  if(!LED)return null;
  const cut=cutStr();
  const ds=LED.dates.filter(d=>d>=cut&&d>=LED.start);
  if(ds.length<2)return null;
  const line=bmkLine(ds,def.mix);
  const i0=line.findIndex(v=>v!=null);
  if(i0<0)return null;
  const v1=[...line].reverse().find(v=>v!=null);
  if(v1==null||!line[i0])return null;
  return (v1/line[i0]-1)*100;
}
function lotsFor(instId){
  const out=[];
  const evs=[...D.events].filter(e=>e[3]===instId&&["buy","sell","set"].includes(e[2])).sort((a,b)=>a[0]<b[0]?-1:1);
  for(const a of D.accounts){
    let lots=[], held=0;
    for(const [d,aid,k,inst,qty,amt] of evs){
      if(aid!==a.id)continue;
      if(k==="buy"){
        const p=priceEur(inst,d);
        const q=qty!=null?qty:(amt&&p?amt/p:0);
        const A=amt!=null?amt:q*p;
        if(q>0){lots.push({d,q,px:A/q});held+=q;}
      }else if(k==="sell"){
        const p=priceEur(inst,d);
        let rem=qty!=null?qty:((amt&&p)?amt/p:0);
        held-=rem;
        while(rem>1e-9&&lots.length){const L=lots[0];const t=Math.min(L.q,rem);L.q-=t;rem-=t;if(L.q<1e-9)lots.shift();}
      }else if(k==="set"){
        const delta=qty-held;
        if(delta>1e-9)lots.push({d,q:delta,px:priceEur(instId,d),est:true});
        else{let rem=-delta;while(rem>1e-9&&lots.length){const L=lots[0];const t=Math.min(L.q,rem);L.q-=t;rem-=t;if(L.q<1e-9)lots.shift();}}
        held=qty;
      }
    }
    if(lots.length)out.push({acct:a.id,lots});
  }
  return out;
}
function perfRange(r){
  if(r.atCost||!r.sym)return null;
  const inst=D.instruments[r.id], q=Q[r.sym];
  if(!q||!q.series||q.last==null)return null;
  const lastEur=livePriceEur(r.id);
  if(RANGE===1){
    const chg=dayChangeEur(r.id,r.qty);
    if(chg==null)return null;
    return {chg, base:(lastEur*r.qty-chg)||lastEur*r.qty};
  }
  const cut=cutStr();
  const d0=q.dates.find(d=>d>=cut)||q.dates[0], c0=q.series[d0];
  if(c0==null)return null;
  const cc=q.ccy||inst.ccy;
  const c0Eur=c0*(cc==="EUR"?1:fxOn(d0,cc));
  return {chg:(lastEur-c0Eur)*r.qty, base:c0Eur*r.qty};
}
function calc(){
  if(!LED)return null;
  const rows=[]; let tot=0, day=0;
  for(const a of D.accounts){
    const A=LED.accts[a.id];
    for(const id in A.qty){
      const qy=A.qty[id]; if(!qy)continue;
      const inst=D.instruments[id];
      const cost=A.cost[id]||null;
      let val, live=false, dayE=null;
      if(inst.atCost){ val=cost||0; }
      else{
        val=livePriceEur(id)*qy;
        const q=inst.sym&&Q[inst.sym];
        live=!!(q&&q.last!=null);
        if(live)dayE=dayChangeEur(id,qy);
      }
      rows.push({acct:a.id,id,name:inst.n,cls:inst.cls,sym:inst.sym,search:inst.search,note:inst.note,qty:qy,val,cost,day:dayE,live,atCost:inst.atCost,
        plE:cost&&!inst.atCost?val-cost:null, plP:cost&&!inst.atCost?(val/cost-1)*100:null});
      tot+=val; if(dayE!=null)day+=dayE;
    }
    tot+=A.cash;
  }
  return {rows,tot,day};
}
// selection-level stats for the current filter + range
function selStats(c){
  const FS=filterSeries();
  const out={val:null,abs:null,twrR:null,pa:null,day:0,dayP:null,ytdT:null,FS};
  if(!FS)return out;
  const n=LED.dates.length-1;
  out.val=FS.tot[n];
  const cut=cutStr();
  let idxs=LED.dates.map((d,i)=>i).filter(i=>LED.dates[i]>=cut&&LED.dates[i]>=LED.start);
  if(RANGE===1)idxs=LED.dates.map((d,i)=>i).filter(i=>LED.dates[i]>=LED.start).slice(-2);
  if(idxs.length>1){
    const i0=idxs[0], i1=idxs[idxs.length-1];
    let flows=0; for(let j=1;j<idxs.length;j++)flows+=FS.flows[idxs[j]]||0;
    out.abs=FS.tot[i1]-FS.tot[i0]-flows;
    const f0=idxs.find(i=>FS.twr[i]!=null);
    if(f0!=null&&FS.twr[i1]!=null&&FS.twr[f0])out.twrR=(FS.twr[i1]/FS.twr[f0]-1)*100;
  }
  out.pa=paOf(LED.dates,FS.twr);
  // today for selection
  const rows=c.rows.filter(r=>SELA.has(r.acct)&&SELC.has(r.cls));
  for(const r of rows)if(r.day!=null)out.day+=r.day;
  out.dayP=out.val&&out.val-out.day?out.day/(out.val-out.day)*100:null;
  const t9=FS.twr[n];
  if(t9){
    const y0=new Date().getFullYear()+"-01-01";
    const i0=LED.dates.findIndex((d,i)=>d>=y0&&FS.twr[i]!=null);
    if(i0>=0&&FS.twr[i0])out.ytdT=(t9/FS.twr[i0]-1)*100;
  }
  out.since=t9?t9-100:null;
  return out;
}

function drawChart(){
  const cv=document.getElementById("chart"), wrap=document.getElementById("chartWrap");
  const W=wrap.clientWidth, H=260, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  if(!LED){ctx.fillStyle="#8e8e96";ctx.font="13px sans-serif";ctx.fillText("Building history…",14,130);return;}
  const cut=cutStr();
  let idxs=LED.dates.map((d,i)=>i).filter(i=>LED.dates[i]>=cut&&LED.dates[i]>=LED.start);
  if(RANGE===1){
    const all=LED.dates.map((d,i)=>i).filter(i=>LED.dates[i]>=LED.start);
    idxs=all.slice(-2);
  }
  if(idxs.length<2){ctx.fillStyle="#8e8e96";ctx.font="13px sans-serif";ctx.fillText("Not enough history",14,130);return;}
  const FS=filterSeries();
  let S;
  if(MODE==="val")S=idxs.map(i=>({d:LED.dates[i],v:FS.tot[i]}));
  else{
    const fi0=idxs.find(i=>FS.twr[i]!=null);
    const base=fi0!=null?FS.twr[fi0]:null;
    S=idxs.filter(i=>FS.twr[i]!=null).map(i=>({d:LED.dates[i],v:FS.twr[i]/(base||100)*100}));
    if(S.length<2){ctx.fillStyle="#8e8e96";ctx.fillText("No TWR data for this selection/range",14,130);return;}
  }
  const bmks=[];
  for(const key in BMK){
    if(!BMK[key])continue;
    const def=BMKDEF[key];
    const raw=bmkLine(S.map(h=>h.d),def.mix);
    const i0=raw.findIndex(v=>v!=null);
    if(i0<0||raw.filter(v=>v!=null).length<2)continue;
    const scale=S[i0].v/raw[i0];
    bmks.push({def,line:raw.map(v=>v==null?null:v*scale),i0});
  }
  const vs=S.map(h=>h.v).concat(...bmks.map(b=>b.line.filter(v=>v!=null)));
  const mn=Math.min(...vs), mx=Math.max(...vs), pad=(mx-mn)*0.08||1;
  const y=v=>12+(H-32)*(1-(v-(mn-pad))/((mx+pad)-(mn-pad)));
  const x=i=>4+(W-8)*i/(S.length-1);
  const col="#26d0c9";
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,col+"2e");grad.addColorStop(1,col+"00");
  ctx.beginPath();ctx.moveTo(x(0),y(S[0].v));
  for(let i=1;i<S.length;i++)ctx.lineTo(x(i),y(S[i].v));
  ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.lineJoin="round";ctx.stroke();
  ctx.lineTo(x(S.length-1),H-4);ctx.lineTo(x(0),H-4);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  for(const b of bmks){
    ctx.beginPath(); let started=false;
    for(let i=0;i<S.length;i++){ const v=b.line[i]; if(v==null)continue; if(!started){ctx.moveTo(x(i),y(v));started=true;} else ctx.lineTo(x(i),y(v)); }
    ctx.strokeStyle=b.def.color;ctx.lineWidth=1.8;ctx.lineJoin="round";ctx.stroke();
  }
  ctx.fillStyle="#8e8e96";ctx.font="11px sans-serif";
  const fmtV=v=>MODE==="val"?eur(v):v.toFixed(1);
  ctx.fillText(fmtV(mx),6,y(mx)-3);ctx.fillText(fmtV(mn),6,y(mn)+13);
  cv.onmousemove=cv.ontouchmove=e=>{
    const r2=cv.getBoundingClientRect(), px=(e.touches?e.touches[0].clientX:e.clientX)-r2.left;
    const i=Math.max(0,Math.min(S.length-1,Math.round((px-4)/(W-8)*(S.length-1))));
    tip.textContent=`${S[i].d}: ${MODE==="val"?eur(S[i].v):S[i].v.toFixed(2)+" (index)"}`;
  };
  cv.onmouseleave=()=>tip.textContent="";
  // legend pills
  const lp=document.getElementById("legendPills");
  lp.innerHTML=`<div class="lpill" style="cursor:default"><span class="sw" style="background:${col}"></span>Portfolio</div>`+
    Object.entries(BMK).filter(([k,on])=>on).map(([k])=>{
      const def=BMKDEF[k], p=bmkRangePct(def);
      return `<div class="lpill" data-bk="${k}"><span class="sw" style="background:${def.color}"></span>${def.label} <span class="${cls(p)}">${pct(p)}</span></div>`;
    }).join("");
  lp.querySelectorAll("[data-bk]").forEach(el=>el.onclick=()=>{BMK[el.dataset.bk]=false;syncCmpRow();render();});
}

async function loadPrices(){
  if(REFRESHING)return;
  REFRESHING=true;
  NETDEAD=false; PROXIES.forEach(p=>p.fails=0);
  try{
    setStatus("busy","Refreshing FX…");
    await getFx();
    const insts=Object.values(D.instruments);
    const toRes=insts.filter(i=>!i.sym&&i.search);
    if(toRes.length&&!NETDEAD){
      setStatus("busy","Resolving fund symbols…");
      await Promise.all(toRes.map(i=>resolveSym(i).catch(()=>{})));
    }
    const syms=[...new Set(insts.filter(i=>i.sym).map(i=>i.sym).concat(["EUNA.DE","VWCE.DE","^OMXH25"]))];
    const chunks=[];for(let i=0;i<syms.length;i+=6)chunks.push(syms.slice(i,i+6));
    let done=0;
    for(const ch of chunks){
      if(NETDEAD)break;
      await Promise.all(ch.map(async s=>{
        try{Q[s]=await getQuote(s);}catch(e){}
        done++;setStatus("busy",`Refreshing prices… ${done}/${syms.length}`);
      }));
      try{validateSyms();LED=buildLedger();render();}catch(e){console.error(e);}
    }
    validateSyms();
    LED=buildLedger();
  }catch(e){ console.error("refresh error",e); }
  finally{
    REFRESHING=false;
    try{
      const c=calc();
      const liveN=c?c.rows.filter(r=>r.live).length:0, symN=c?c.rows.filter(r=>r.sym||r.search).length:0;
      const ts=new Date().toLocaleTimeString("fi-FI",{hour:"2-digit",minute:"2-digit"});
      if(NETDEAD)setStatus("warn",`${ts} · price sources unreachable — last known prices`);
      else setStatus(liveN>=symN*0.8?"ok":"warn",`Updated ${ts} · ${liveN}/${symN} live · EUR/USD ${FXNOW.USD?.toFixed(4)}`);
      render();
    }catch(e){ setStatus("warn","Update finished with errors — showing stored data"); }
  }
}

function buildFilters(){
  const ar=document.getElementById("acctFilt"), cr=document.getElementById("clsFilt");
  ar.innerHTML="";cr.innerHTML="";
  SELA=new Set(D.accounts.map(a=>a.id));
  SELC=new Set(allClasses());
  const mkChip=(row,label,cb,act)=>{
    const el=document.createElement("div");
    el.className="chip"+(act?" act":" on");
    el.textContent=label;
    el.onclick=()=>cb(el);
    row.appendChild(el);
    return el;
  };
  const acctChips=[], clsChips=[];
  mkChip(ar,"All",()=>{SELA=new Set(D.accounts.map(a=>a.id));acctChips.forEach(x=>x.classList.add("on"));render();},true);
  mkChip(ar,"None",()=>{SELA=new Set();acctChips.forEach(x=>x.classList.remove("on"));render();},true);
  for(const a of D.accounts){
    acctChips.push(mkChip(ar,a.name.replace(" (at cost)",""),el=>{
      if(SELA.has(a.id)){SELA.delete(a.id);el.classList.remove("on");}
      else{SELA.add(a.id);el.classList.add("on");}
      render();
    }));
  }
  mkChip(cr,"All",()=>{SELC=new Set(allClasses());clsChips.forEach(x=>x.classList.add("on"));render();},true);
  mkChip(cr,"None",()=>{SELC=new Set();clsChips.forEach(x=>x.classList.remove("on"));render();},true);

    document.querySelector('.crng[data-r="1"]').classList.add("on");
    LED=buildLedger();render();loadPrices();
  }catch(e){lockMsg.textContent="Wrong password";}
}
