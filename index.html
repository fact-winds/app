<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Salkku</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--card2:#1d232e;--tx:#e8ecf2;--mut:#8b95a5;--grn:#31c48d;--red:#f05252;--acc:#4f8ef7;--brd:#252d3a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:50}
#lock h1{font-size:20px;font-weight:600}
#pw{background:var(--card);border:1px solid var(--brd);color:var(--tx);padding:12px 16px;border-radius:10px;font-size:17px;width:100%;max-width:320px;text-align:center}
#unlockBtn{background:var(--acc);color:#fff;border:0;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
#lockMsg{color:var(--red);font-size:13px;min-height:18px}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px;display:none}
.hero{padding:18px 4px 6px}
.hero .lbl{font-size:13px;color:var(--mut)}
.hero .tot{font-size:34px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.hero .sub{margin-top:4px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.pos{color:var(--grn)}.neg{color:var(--red)}
.chartCard{background:var(--card);border:1px solid var(--brd);border-radius:14px;margin-top:12px;padding:12px 8px 6px}
.rngRow{display:flex;gap:6px;padding:0 6px 8px}
.rng{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:13px;color:var(--mut);cursor:pointer;border:1px solid transparent}
.rng.on{background:var(--card2);color:var(--tx);border-color:var(--brd)}
#chartWrap{position:relative}
#chart{width:100%;height:220px;display:block;touch-action:pan-y}
#tip{position:absolute;top:6px;left:8px;font-size:12px;color:var(--mut);pointer-events:none}
.chgLine{display:flex;justify-content:space-between;padding:6px 10px 4px;font-size:13px;color:var(--mut)}
.pillrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;margin-top:14px;overflow:hidden}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .v{font-size:14px;color:var(--tx);font-weight:600;text-transform:none;letter-spacing:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-top:1px solid var(--brd);gap:10px}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{font-size:12px;color:var(--mut);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.row .r{text-align:right;flex-shrink:0}
.row .val{font-weight:600}
.row .chg{font-size:12px;margin-top:2px}
.badge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--card2);border:1px solid var(--brd);color:var(--mut)}
.badge.stale{color:#e3a008;border-color:#e3a00855}
#allocWrap{display:flex;gap:10px;padding:14px;flex-wrap:wrap;justify-content:center}
canvas.donut{max-width:280px;max-height:280px}
.legend{display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:13px;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:12px;line-height:1.6}
.tabs{display:flex;gap:8px;margin-top:16px}
.tab{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--brd);color:var(--mut);font-size:13px;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--acc)}
#refresh{position:fixed;right:16px;bottom:16px;background:var(--acc);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);display:none}
@media (max-width:480px){.hero .tot{font-size:30px}}
</style>
</head>
<body>
<div id="lock">
  <h1>Salkku</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="unlockBtn">Unlock</button>
  <div id="lockMsg"></div>
</div>
<main id="app">
  <div class="hero">
    <div class="lbl">Total portfolio value</div>
    <div class="tot" id="totVal">–</div>
    <div class="sub">
      <span>Today <span id="dayChg">–</span></span>
      <span id="twrLbl">TWR <span id="twrAll">–</span></span>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px" id="hl"></div>
  <div class="chartCard">
    <div class="rngRow" id="modeRow">
      <div class="mode rng on" data-m="twr">Return % (TWR)</div>
      <div class="mode rng" data-m="val">Value €</div>
    </div>
    <div class="rngRow" id="chartRngRow">
      <div class="crng rng" data-r="7">7 pv</div>
      <div class="crng rng on" data-r="30">30 pv</div>
      <div class="crng rng" data-r="ytd">YTD</div>
      <div class="crng rng" data-r="365">1 v</div>
      <div class="crng rng" data-r="9999">Max</div>
    </div>
    <div class="rngRow" id="bmkRow">
      <div class="bmk rng" data-b="sp">vs S&P 500</div>
      <div class="bmk rng" data-b="b6040">vs 60/40</div>
    </div>
    <div class="rngRow" id="acctFilt" style="flex-wrap:wrap"></div>
    <div class="rngRow" id="clsFilt" style="flex-wrap:wrap"></div>
    <div id="chartWrap"><canvas id="chart"></canvas><div id="tip"></div></div>
    <div class="chgLine"><span id="rngChg">–</span><span id="rngSpan"></span></div>
  </div>
  <div class="pillrow">
    <span class="pill" id="liveState">loading…</span>
    <span class="pill" id="fxPill"></span>
    <span class="pill" id="tsPill"></span>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="hold">Holdings</div>
    <div class="tab" data-t="acct">Accounts</div>
    <div class="tab" data-t="alloc">Allocation</div>
  </div>
  <div class="rngRow" id="listRngRow" style="margin-top:10px">
    <div class="lrng rng on" data-r="1">1 pv</div>
    <div class="lrng rng" data-r="7">7 pv</div>
    <div class="lrng rng" data-r="30">30 pv</div>
    <div class="lrng rng" data-r="365">1 v</div>
  </div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</main>
<button id="refresh" title="Refresh">↻</button>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CIPHER))));
}
let D=null, Q={}, FXNOW={USD:1.1645,SEK:11.05}, FXH=null, RANGE=30, LRANGE=1, MODE="twr", LED=null;
// Finnish calendar day (6:00 Helsinki boundary) of a timestamp
function fiDayOf(ms){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit"}).formatToParts(new Date(ms));
  const g=t=>p.find(x=>x.type===t).value;
  let d=`${g("year")}-${g("month")}-${g("day")}`;
  if(+g("hour")<6)d=dayBefore(d);
  return d;
}
const BMK={sp:false,b6040:false};
let SELA=null, SELC=null; // account / class filters (Sets), null = not yet initialised
const BMKDEF={sp:{label:"S&P 500 (EUR)",color:"#f6ad37",mix:[["SXR8.DE",1]]},b6040:{label:"60/40 (EUR)",color:"#9061f9",mix:[["SXR8.DE",0.6],["EUNA.DE",0.4]]}};
const fmt=(n,d=0)=>n==null?"–":n.toLocaleString("en-IE",{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/,/g," ");
const eur=(n,d=0)=>n==null?"–":(n<0?"-€":"€")+fmt(Math.abs(n),d);
const sgn=(n,d=0)=>n==null?"–":(n>=0?"+":"-")+"€"+fmt(Math.abs(n),d);
const pct=n=>n==null?"–":(n>=0?"+":"")+n.toFixed(2)+"%";
const cls=n=>n==null?"":(n>=0?"pos":"neg");
const dstr=t=>new Date(t*1000).toISOString().slice(0,10);
const dayBefore=d=>new Date(new Date(d).getTime()-864e5).toISOString().slice(0,10);

const PROXIES=[u=>"https://corsproxy.io/?url="+encodeURIComponent(u), u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
async function pfetch(url){
  for(const p of PROXIES){
    try{const r=await fetch(p(url),{signal:AbortSignal.timeout(9000)});if(r.ok){const t=await r.text();if(t&&t.length>40)return JSON.parse(t);}}catch(e){}
  }
  return null;
}
async function getFx(){
  const end=new Date().toISOString().slice(0,10);
  try{
    const r=await fetch(`https://api.frankfurter.dev/v1/2025-03-01..${end}?base=EUR&symbols=USD,SEK`,{signal:AbortSignal.timeout(12000)});
    if(r.ok){const j=await r.json();FXH=j.rates;const ks=Object.keys(j.rates).sort();const last=j.rates[ks[ks.length-1]];FXNOW={USD:last.USD,SEK:last.SEK};}
  }catch(e){}
}
function fxOn(date,ccy){
  if(ccy==="EUR")return 1;
  if(!FXH)return 1/FXNOW[ccy];
  let d=date;
  for(let i=0;i<10;i++){ if(FXH[d])return 1/FXH[d][ccy]; d=dayBefore(d); }
  return 1/FXNOW[ccy];
}
function symCache(){try{return JSON.parse(localStorage.getItem("symc")||"{}")}catch(e){return{}}}
async function resolveSym(inst){
  if(inst.sym||!inst.search)return;
  const c=symCache(), key=inst.search[0];
  if(c[key]&&Date.now()-c[key].t<6048e5){inst.sym=c[key].s||null;return;}
  for(const q of inst.search){
    if(/^[A-Z0-9.\-]{2,14}$/.test(q)&&q.includes(".")){
      const j=await pfetch(`https://query1.finance.yahoo.com/v8/finance/chart/${q}?range=5d&interval=1d`);
      if(j&&j.chart&&j.chart.result){inst.sym=q;break;}
    }else{
      const j=await pfetch(`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=6&newsCount=0`);
      let qs=(j&&j.quotes)||[];
      if(inst.match)qs=qs.filter(x=>((x.shortname||"")+" "+(x.longname||"")).toLowerCase().includes(inst.match.toLowerCase()));
      const pick=qs.find(x=>x.quoteType==="MUTUALFUND"&&/\.(F|ST|HE|IR|L)$/.test(x.symbol))||qs.find(x=>x.quoteType==="MUTUALFUND")||qs.find(x=>/\.(HE|ST|F)$/.test(x.symbol))||(inst.match?qs[0]:null);
      if(pick){inst.sym=pick.symbol;break;}
    }
  }
  c[key]={s:inst.sym||null,t:Date.now()};
  try{localStorage.setItem("symc",JSON.stringify(c))}catch(e){}
}
async function getQuote(sym){
  const j=await pfetch(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=2y&interval=1d`);
  try{
    const res=j.chart.result[0], m=res.meta, raw=res.indicators.quote[0].close, ts=res.timestamp;
    const series={};
    for(let i=0;i<ts.length;i++){ if(raw[i]!=null)series[dstr(ts[i])]=raw[i]; }
    const dates=Object.keys(series).sort();
    const last=m.regularMarketPrice??series[dates[dates.length-1]];
    if(m.regularMarketPrice!=null)series[dates[dates.length-1]]=m.regularMarketPrice;
    const prev=dates.length>1?series[dates[dates.length-2]]:m.chartPreviousClose;
    return {last,prev,series,dates,ccy:m.currency,time:m.regularMarketTime||null};
  }catch(e){return null;}
}
// price in EUR for instrument on date (ffill). mode: series > navObs > fb
function priceEur(id,d){
  const inst=D.instruments[id];
  const q=inst.sym&&Q[inst.sym];
  if(q&&q.series){
    let dd=d, c=null;
    for(let i=0;i<12;i++){ if(q.series[dd]!=null){c=q.series[dd];break;} dd=dayBefore(dd); }
    if(c==null)c=q.series[q.dates[0]];
    const cc=q.ccy||inst.ccy;
    return c*(cc==="EUR"?1:fxOn(d,cc));
  }
  if(inst.nav){
    const nav=inst.nav;
    if(d<=nav[0][0])return nav[0][1];
    for(let i=0;i<nav.length-1;i++){
      if(d>=nav[i][0]&&d<=nav[i+1][0]){
        const t0=new Date(nav[i][0]).getTime(), t1=new Date(nav[i+1][0]).getTime(), t=new Date(d).getTime();
        return nav[i][1]+(nav[i+1][1]-nav[i][1])*(t1>t0?(t-t0)/(t1-t0):0);
      }
    }
    return nav[nav.length-1][1];
  }
  if(inst.fb!=null){
    if(inst.fbEur||inst.ccy==="EUR")return inst.fb;
    return inst.fb/FXNOW[inst.ccy];
  }
  return 0;
}
function livePriceEur(id){ return priceEur(id,new Date().toISOString().slice(0,10)); }
// reject resolved symbols whose price contradicts known NAV observations (wrong-instrument guard)
function validateSyms(){
  for(const id in D.instruments){
    const inst=D.instruments[id];
    if(inst.noval)continue;
    if(!inst.sym||!inst.nav||!Q[inst.sym]||!Q[inst.sym].series)continue;
    const [ld,lv]=inst.nav[inst.nav.length-1];
    const q=Q[inst.sym];
    let dd=ld,c=null;
    for(let i=0;i<12;i++){ if(q.series[dd]!=null){c=q.series[dd];break;} dd=dayBefore(dd); }
    if(c==null)continue;
    const cc=q.ccy||inst.ccy;
    const pe=c*(cc==="EUR"?1:fxOn(ld,cc));
    const ratio=pe/lv;
    if(!(ratio>0.8&&ratio<1.25)){ inst.sym=null; }
  }
}
function prevPriceEur(id){
  const inst=D.instruments[id], q=inst.sym&&Q[inst.sym];
  if(q&&q.prev!=null){const cc=q.ccy||inst.ccy;return q.prev*(cc==="EUR"?1:1/FXNOW[cc]);}
  return null;
}
// calendar-day change (Helsinki, 6:00 boundary): 0 unless the instrument has traded this Finnish day
function dayChangeEur(id,qy){
  const inst=D.instruments[id], q=inst.sym&&Q[inst.sym];
  if(!q||!q.series||q.last==null)return null;
  const todayFi=fiDayOf(Date.now());
  const lastTrade=q.time?fiDayOf(q.time*1000):q.dates[q.dates.length-1];
  if(lastTrade!==todayFi)return 0;
  // reference close: last close strictly before today's Finnish day
  let refD=null;
  for(let i=q.dates.length-1;i>=0;i--){ if(q.dates[i]<todayFi){refD=q.dates[i];break;} }
  if(refD==null)return 0;
  const cc=q.ccy||inst.ccy;

  const refEur=q.series[refD]*(cc==="EUR"?1:fxOn(refD,cc));

// ---- ledger replay ----
function buildLedger(){
  const evs=[...D.events].sort((a,b)=>a[0]<b[0]?-1:1);
  const start=evs[0][0];
  // date grid: union of a reference series + event dates
  const ds=new Set(); evs.forEach(e=>ds.add(e[0]));
  for(const i of Object.values(D.instruments)){
    const q=i.sym&&Q[i.sym];
    if(q&&q.dates)for(const d of q.dates)if(d>=start)ds.add(d);
  }
  let dates=[...ds].sort();
  const today=new Date().toISOString().slice(0,10); ds.add(today);
  dates=[...ds].sort();
  if(dates[0]<start)dates=dates.filter(d=>d>=start);
  // state per account
  const accts={}; D.accounts.forEach(a=>accts[a.id]={qty:{},cost:{},cash:0});
  const series={}; D.accounts.forEach(a=>series[a.id]=[]); series._flows={};
  const clsHist=[];
  // pre-pass: amortize cash-checkpoint drift (fees/dividends/untracked) over preceding days instead of a one-day jump
  const dailyAdj={};
  {
    const firstEv={};
    for(const e of evs)if(!firstEv[e[1]])firstEv[e[1]]=e[0];
    const sim={}; D.accounts.forEach(a=>sim[a.id]={cash:0,qty:{},lastCk:firstEv[a.id]||dates[0]});
    for(const [ed,aid,k,...r] of evs){
      const S=sim[aid]; if(!S)continue;
      if(k==="flow")S.cash+=r[0];
      else if(k==="buy"||k==="sell"){
        let amt=r[2];
        if(amt==null)amt=(r[1]||0)*priceEur(r[0],ed);
        const qy=r[1]!=null?r[1]:(amt/(priceEur(r[0],ed)||1));
        S.qty[r[0]]=(S.qty[r[0]]||0)+(k==="buy"?1:-1)*qy;
        S.cash-=(k==="buy"?1:-1)*amt;
      }
      else if(k==="set"){
        const delta=r[1]-(S.qty[r[0]]||0);
        S.cash-=delta*priceEur(r[0],ed);
        S.qty[r[0]]=r[1];
      }
      else if(k==="cash"){
        const drift=r[0]-S.cash;
        const span=dates.filter(x=>x>S.lastCk&&x<=ed);
        if(span.length&&Math.abs(drift)>0.01){
          const per=drift/span.length;
          dailyAdj[aid]=dailyAdj[aid]||{};
          for(const x of span)dailyAdj[aid][x]=(dailyAdj[aid][x]||0)+per;
        }
        S.cash=r[0]; S.lastCk=ed;
      }
    }
  }
  const valHist=[], flowHist={};
  const addFlow=(ed,aid,cl,amt)=>{ if(!amt)return; const fh=flowHist[ed]=flowHist[ed]||{}; const k=aid+"|"+cl; fh[k]=(fh[k]||0)+amt; };
  let ei=0;
  for(const d of dates){
    for(const a of D.accounts){const ad=dailyAdj[a.id];if(ad&&ad[d])accts[a.id].cash+=ad[d];}
    while(ei<evs.length&&evs[ei][0]<=d){
      const [ed,aid,k,...r]=evs[ei]; ei++;
      const A=accts[aid]; if(!A)continue;
      if(k==="flow"){ A.cash+=r[0]; series._flows[ed+aid]=(series._flows[ed+aid]||0)+r[0]; addFlow(ed,aid,"Cash",r[0]); }
      else if(k==="cash"){ A.cash=r[0]; }
      else if(k==="buy"||k==="sell"){
        let [inst,qty,amt]=r;
        const p=priceEur(inst,ed);
        if(qty==null)qty=amt!=null&&p?amt/p:0;
        if(amt==null)amt=qty*p;
        const s=k==="buy"?1:-1;
        if(k==="buy"){A.cost[inst]=(A.cost[inst]||0)+amt;}
        else{const held=A.qty[inst]||0;const avg=held?(A.cost[inst]||0)/held:0;A.cost[inst]=(A.cost[inst]||0)-avg*qty;}
        A.qty[inst]=(A.qty[inst]||0)+s*qty;
        if(Math.abs(A.qty[inst])<1e-6){A.qty[inst]=0;A.cost[inst]=0;}
        A.cash-=s*amt;
        addFlow(ed,aid,D.instruments[inst].cls,s*amt);
        addFlow(ed,aid,"Cash",-s*amt);
      }
      else if(k==="set"){
        const [inst,qty]=r;
        const cur=A.qty[inst]||0, delta=qty-cur;
        if(Math.abs(delta)>1e-9){
          const p=priceEur(inst,ed), amt=Math.abs(delta)*p;
          if(delta>0)A.cost[inst]=(A.cost[inst]||0)+amt;
          else{const avg=cur?(A.cost[inst]||0)/cur:0;A.cost[inst]=(A.cost[inst]||0)-avg*Math.abs(delta);}
          A.cash-=delta*p;
          addFlow(ed,aid,D.instruments[inst].cls,delta*p);
          addFlow(ed,aid,"Cash",-delta*p);
        }
        A.qty[inst]=qty;
        if(Math.abs(A.qty[inst])<1e-6){A.qty[inst]=0;A.cost[inst]=0;}
      }
    }
    let byCls={}, cells={};
    for(const a of D.accounts){
      const A=accts[a.id];
      let v=A.cash;
      byCls["Cash"]=(byCls["Cash"]||0)+A.cash;
      cells[a.id+"|Cash"]=(cells[a.id+"|Cash"]||0)+A.cash;
      for(const id in A.qty){
        if(!A.qty[id])continue;
        const inst=D.instruments[id];
        const pv=inst.atCost?(A.cost[id]||0):A.qty[id]*priceEur(id,d);
        v+=pv;
        byCls[inst.cls]=(byCls[inst.cls]||0)+pv;
        cells[a.id+"|"+inst.cls]=(cells[a.id+"|"+inst.cls]||0)+pv;
      }
      series[a.id].push(v);
    }
    clsHist.push(byCls);
    valHist.push(cells);
  }
  // TWR per twr-account aggregate
  const twrIds=D.accounts.filter(a=>a.twr).map(a=>a.id);
  const agg=dates.map((d,i)=>twrIds.reduce((s,id)=>s+series[id][i],0));
  const twr=[]; let idx=null;
  for(let i=0;i<dates.length;i++){
    const F=twrIds.reduce((s,id)=>s+(series._flows[dates[i]+id]||0),0);
    if(idx==null){ if(agg[i]>50000)idx=100; twr.push(idx); continue; }
    const v0=agg[i-1];
    if(v0>50000){ const r=(agg[i]-F-v0)/v0; if(Math.abs(r)<0.5)idx*=(1+r); }
    twr.push(idx);
  }
  const total=dates.map((d,i)=>D.accounts.reduce((s,a)=>s+series[a.id][i],0));
  return {dates,series,total,twr,agg,accts,start,clsHist,valHist,flowHist};
}
// current holdings from ledger end state
function calc(){
  if(!LED)return null;
  const rows=[]; let tot=0, day=0;
  for(const a of D.accounts){
    const A=LED.accts[a.id];
    for(const id in A.qty){
      const qy=A.qty[id]; if(!qy)continue;
      const inst=D.instruments[id];
      const cost=A.cost[id]||null;
      let val, live=false, dayE=null;
      if(inst.atCost){ val=cost||0; }
      else{
        val=livePriceEur(id)*qy;
        const q=inst.sym&&Q[inst.sym];
        live=!!(q&&q.last!=null);
        if(live)dayE=dayChangeEur(id,qy);
      }
      rows.push({acct:a.id,id,name:inst.n,cls:inst.cls,sym:inst.sym,search:inst.search,note:inst.note,qty:qy,val,cost,day:dayE,live,atCost:inst.atCost,
        plE:cost&&!inst.atCost?val-cost:null, plP:cost&&!inst.atCost?(val/cost-1)*100:null});
      tot+=val; if(dayE!=null)day+=dayE;
    }
    tot+=A.cash;
  }
  return {rows,tot,day};
}
function perf(r,days){
  if(r.atCost||!r.sym)return null;
  const inst=D.instruments[r.id], q=Q[r.sym];
  if(!q||!q.series||q.last==null)return null;
  const lastEur=livePriceEur(r.id);
  let c0,d0;
  if(days===1){
    const chg=dayChangeEur(r.id,r.qty);
    if(chg==null)return null;
    const base=lastEur*r.qty-chg;
    return {chg, base:base||lastEur*r.qty};
  }
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  d0=q.dates.find(d=>d>=cut)||q.dates[0]; c0=q.series[d0];
  if(c0==null)return null;
  const c0Eur=c0*(inst.ccy==="EUR"?1:fxOn(d0,inst.ccy));
  return {chg:(lastEur-c0Eur)*r.qty, base:c0Eur*r.qty};
}
// filtered value + TWR series for current account/class selection
function allClasses(){ const s=new Set(["Cash"]); for(const id in D.instruments)s.add(D.instruments[id].cls); return [...s]; }
function filtersActive(){ return SELA&&SELC&&(SELA.size<D.accounts.length||SELC.size<allClasses().length); }
function filterSeries(){
  if(!LED)return null;
  if(!SELA||!SELC)return {tot:LED.total,twr:LED.twr};
  const twrOk=new Set(D.accounts.filter(a=>a.twr).map(a=>a.id));
  const n=LED.dates.length;
  const tot=new Array(n), tw=new Array(n);
  const noTwr=![...SELC].some(c=>c!=="Cash"); // cash-only selection: TWR not meaningful
  let idx=null, prevV=null;
  for(let i=0;i<n;i++){
    let v=0, vt=0;
    const cells=LED.valHist[i];
    for(const k in cells){
      const pi=k.indexOf("|"), a=k.slice(0,pi), c=k.slice(pi+1);
      if(SELA.has(a)&&SELC.has(c)){ v+=cells[k]; if(twrOk.has(a))vt+=cells[k]; }
    }
    tot[i]=v;
    let F=0;
    const fl=LED.flowHist[LED.dates[i]];
    if(fl)for(const k in fl){
      const pi=k.indexOf("|"), a=k.slice(0,pi), c=k.slice(pi+1);
      if(SELA.has(a)&&SELC.has(c)&&twrOk.has(a))F+=fl[k];
    }
    if(noTwr){ tw[i]=null; prevV=vt; continue; }
    if(idx==null){ if(vt>50000)idx=100; tw[i]=idx; prevV=vt; continue; }
    if(prevV>50000){ const r=(vt-F-prevV)/prevV; if(Math.abs(r)<0.5)idx*=(1+r); }
    tw[i]=idx; prevV=vt;
  }
  return {tot,twr:tw};
}
// benchmark index over date list (daily-rebalanced mix of EUR series), base 100 at first computable date
function bmkLine(dates,mix){
  let idx=100, prev=null; const out=[];
  const closeOn=(sym,d)=>{const q=Q[sym];if(!q)return null;let dd=d;for(let i=0;i<12;i++){if(q.series[dd]!=null)return q.series[dd];dd=dayBefore(dd);}return null;};
  for(const d of dates){
    const ps=mix.map(([s])=>closeOn(s,d));
    if(ps.some(p=>p==null)){out.push(null);continue;}
    if(prev){let r=0;mix.forEach(([s,w],i)=>{r+=w*(ps[i]/prev[i]-1);});idx*=1+r;}
    prev=ps; out.push(idx);
  }
  return out;
}

    const acash=LED.accts[a.id].cash;
    if(!rs.length&&!acash)continue;
    let av=rs.reduce((s,r)=>s+r.val,0)+acash;
    let chg=0,base=0;
    const perfs=rs.map(r=>{const pf=perf(r,LRANGE);if(pf){chg+=pf.chg;base+=pf.base;}else{base+=r.val;}return pf;});
    base+=acash;
    const chgP=base?chg/base*100:null;
    const card=document.createElement("div");card.className="card";
    let h=`<h2>${a.name}<span class="v">${eur(av)} <span class="${cls(chg)}" style="font-weight:500">${chg?`${sgn(chg)} (${pct(chgP)})`:""}</span></span></h2>`;
    const idx=rs.map((r,i)=>i).sort((x,y)=>{
      const xp=perfs[x]&&perfs[x].base?perfs[x].chg/perfs[x].base:-1e8;
      const yp=perfs[y]&&perfs[y].base?perfs[y].chg/perfs[y].base:-1e8;
      return yp-xp;
    });
    for(const i of idx)h+=rowHtml(rs[i],perfs[i]);
    if(acash)h+=`<div class="row"><div class="l"><div class="nm">Cash</div></div><div class="r"><div class="val ${acash<0?"neg":""}">${eur(acash)}</div></div></div>`;
    card.innerHTML=h;view.appendChild(card);
  }
}
function renderAlloc(c){
  const by={};
  for(const r of c.rows){by[r.cls]=(by[r.cls]||0)+r.val;}
  let cash=0;for(const a of D.accounts)cash+=LED.accts[a.id].cash;
  by["Cash"]=(by["Cash"]||0)+cash;
  const ent=Object.entries(by).filter(([k,v])=>v>0.5).sort((a,b)=>b[1]-a[1]);
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<h2>Asset allocation<span class="v">${eur(c.tot)}</span></h2><div id="allocWrap"><canvas class="donut" id="donut" width="280" height="280"></canvas><div class="legend" id="lg"></div></div>`;
  view.appendChild(card);
  const ctx=document.getElementById("donut").getContext("2d");
  const total=ent.reduce((s,[,v])=>s+v,0);
  let a0=-Math.PI/2;
  ent.forEach(([k,v],i)=>{
    const a1=a0+v/total*2*Math.PI;
    ctx.beginPath();ctx.arc(140,140,110,a0,a1);ctx.arc(140,140,62,a1,a0,true);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();a0=a1;
  });
  lg.innerHTML=ent.map(([k,v],i)=>`<div class="li"><span class="sw" style="background:${COLORS[i%COLORS.length]}"></span>${k} · <b>${eur(v)}</b> (${(v/total*100).toFixed(1)}%)</div>`).join("");
  const card2=document.createElement("div");card2.className="card";
  let h=`<h2>By account</h2>`;
  for(const a of D.accounts){
    const av=c.rows.filter(r=>r.acct===a.id).reduce((s,r)=>s+r.val,0)+LED.accts[a.id].cash;
    if(Math.abs(av)<0.5)continue;
    h+=`<div class="row"><div class="l"><div class="nm">${a.name}</div></div><div class="r"><div class="val">${eur(av)}</div><div class="chg">${(av/c.tot*100).toFixed(1)}%</div></div></div>`;
  }
  card2.innerHTML=h;view.appendChild(card2);
  // allocation over time
  if(LED&&LED.clsHist&&LED.clsHist.length>2){
    const card3=document.createElement("div");card3.className="card";
    card3.innerHTML=`<h2>Allocation over time<span class="v">% of portfolio</span></h2><div style="padding:10px"><canvas id="allocHist" style="width:100%;height:200px;display:block"></canvas></div><div class="legend" id="lg2" style="padding:0 14px 14px;flex-direction:row;flex-wrap:wrap;gap:10px"></div>`;
    view.appendChild(card3);
    const cv=document.getElementById("allocHist"), W2=cv.clientWidth||600, H2=200, dpr=window.devicePixelRatio||1;
    cv.width=W2*dpr;cv.height=H2*dpr;
    const cx=cv.getContext("2d");cx.scale(dpr,dpr);
    const clsOrder=ent.map(e=>e[0]);
    const n=LED.clsHist.length;
    const shares=clsOrder.map(k=>LED.clsHist.map((h,i)=>LED.total[i]>0?(h[k]||0)/LED.total[i]*100:null));
    const allv=shares.flat().filter(v=>v!=null);
    const mx2=Math.min(100,Math.max(...allv)*1.08), mn2=0;
    const y2=v=>10+(H2-30)*(1-(v-mn2)/(mx2-mn2));
    const x2=i=>6+(W2-12)*i/(n-1);
    cx.strokeStyle="#252d3a";cx.beginPath();cx.moveTo(6,y2(0));cx.lineTo(W2-6,y2(0));cx.stroke();
    clsOrder.forEach((k,ci)=>{
      cx.beginPath();let st=false;
      for(let i=0;i<n;i++){const v=shares[ci][i];if(v==null)continue;if(!st){cx.moveTo(x2(i),y2(v));st=true;}else cx.lineTo(x2(i),y2(v));}
      cx.strokeStyle=COLORS[ci%COLORS.length];cx.lineWidth=1.8;cx.lineJoin="round";cx.stroke();
    });
    cx.fillStyle="#8b95a5";cx.font="10px sans-serif";
    cx.fillText(LED.dates[0],6,H2-4);cx.textAlign="right";cx.fillText(LED.dates[n-1],W2-6,H2-4);cx.textAlign="left";
    cx.fillText(mx2.toFixed(0)+"%",6,14);
    document.getElementById("lg2").innerHTML=clsOrder.map((k,i)=>`<div class="li"><span class="sw" style="background:${COLORS[i%COLORS.length]}"></span>${k} ${(shares[i][n-1]??0).toFixed(1)}%</div>`).join("");
  }
}
async function loadPrices(){
  liveState.textContent="fetching…";
  await getFx();
  const insts=Object.values(D.instruments);
  for(const i of insts.filter(i=>!i.sym&&i.search))await resolveSym(i);
  const syms=[...new Set(insts.filter(i=>i.sym).map(i=>i.sym).concat(["EUNA.DE"]))];
  const chunks=[];for(let i=0;i<syms.length;i+=6)chunks.push(syms.slice(i,i+6));
  for(const ch of chunks){
    await Promise.all(ch.map(async s=>{Q[s]=await getQuote(s);}));
    validateSyms();LED=buildLedger();render();
  }
  validateSyms();
  LED=buildLedger();
  render();
}
function buildFilters(){
  const ar=document.getElementById("acctFilt"), cr=document.getElementById("clsFilt");
  ar.innerHTML="";cr.innerHTML="";
  SELA=new Set(D.accounts.map(a=>a.id));
  SELC=new Set(allClasses());
  const mkChip=(row,label,cb)=>{
    const el=document.createElement("div");
    el.className="rng on";
    el.style.cssText="flex:0 1 auto;padding:5px 10px;font-size:12px";
    el.textContent=label;
    el.onclick=()=>cb(el);
    row.appendChild(el);
  };
  for(const a of D.accounts){
    mkChip(ar,a.name.replace(" (at cost)",""),el=>{
      if(SELA.has(a.id)){SELA.delete(a.id);el.classList.remove("on");}
      else{SELA.add(a.id);el.classList.add("on");}
      drawChart();
    });
  }
  for(const c of allClasses()){
    mkChip(cr,c,el=>{
      if(SELC.has(c)){SELC.delete(c);el.classList.remove("on");}
      else{SELC.add(c);el.classList.add("on");}
      drawChart();
    });
  }
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");render();});
document.querySelectorAll(".crng").forEach(r=>r.onclick=()=>{document.querySelectorAll(".crng").forEach(x=>x.classList.remove("on"));r.classList.add("on");RANGE=r.dataset.r==="ytd"?"ytd":+r.dataset.r;drawChart();});
document.querySelectorAll(".bmk").forEach(r=>r.onclick=()=>{const k=r.dataset.b;BMK[k]=!BMK[k];r.classList.toggle("on",BMK[k]);drawChart();});
document.querySelectorAll(".mode").forEach(r=>r.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));r.classList.add("on");MODE=r.dataset.m;drawChart();});
document.querySelectorAll(".lrng").forEach(r=>r.onclick=()=>{document.querySelectorAll(".lrng").forEach(x=>x.classList.remove("on"));r.classList.add("on");LRANGE=+r.dataset.r;render();});
refresh.onclick=()=>{Q={};LED=null;loadPrices();};
window.addEventListener("resize",drawChart);
async function unlock(){
  lockMsg.textContent="";
  try{
    D=await decrypt(pw.value);
    sessionStorage.setItem("k",pw.value);
    document.getElementById("lock").style.display="none";
    document.getElementById("app").style.display="block";
    refresh.style.display="block";
    buildFilters();
    LED=buildLedger();render();loadPrices();
  }catch(e){lockMsg.textContent="Wrong password";}
}
unlockBtn.onclick=unlock;
pw.addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
window.addEventListener("load",()=>{const k=sessionStorage.getItem("k");if(k){pw.value=k;unlock();}});
</script>
